name: Promote to staging

# Manual promotion only. Staging is its own separate Firebase project
# (innovacaretrainninng-staging) with its own Firestore/Storage/Database/
# Functions — not shared with dev — so this deploys the full stack there,
# same shape as deploy-dev.yml / deploy-production.yml.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA to deploy to staging'
        required: false
        default: main
      deploy_functions:
        description: 'Deploy Cloud Functions too. Requires staging Cloud Build IAM to be fixed first.'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-staging
  cancel-in-progress: false

defaults:
  run:
    working-directory: innovacare-trainning-main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build & deploy (staging)
    runs-on: ubuntu-latest
    environment: innovacaretrainning-staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: innovacare-trainning-main/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Build (optimized, pointed at the staging Firebase backend)
        run: npx ng build --configuration staging

      - name: Install functions dependencies (default codebase)
        working-directory: innovacare-trainning-main/functions
        run: npm ci

      - name: Install functions dependencies (innovacare-training codebase)
        working-directory: innovacare-trainning-main/innovacare-training
        run: npm ci

      - uses: google-github-actions/auth@v2
        with:
          project_id: innovacaretrainninng-staging
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          # Verify this matches the actual "firebase-adminsdk-*" account on
          # this project's IAM & Admin → Service accounts page before first use.
          service_account: firebase-adminsdk-fbsvc@innovacaretrainninng-staging.iam.gserviceaccount.com

      - name: Explain Cloud Functions IAM requirement
        if: ${{ inputs.deploy_functions }}
        run: |
          PROJECT_ID="innovacaretrainninng-staging"
          PROJECT_NUMBER="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          echo "Cloud Functions deployment is enabled for staging."
          echo "If function creation fails with missing build-service-account permission, grant these IAM roles manually:"
          echo "  ${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com: roles/logging.logWriter roles/artifactregistry.writer roles/storage.objectViewer"
          echo "  ${PROJECT_NUMBER}-compute@developer.gserviceaccount.com: roles/logging.logWriter roles/artifactregistry.writer roles/storage.objectViewer"

      - name: Verify Cloud Functions secrets exist
        if: ${{ inputs.deploy_functions }}
        # functions/src/index.ts declares these via defineSecret(). If any is
        # missing from this project's Secret Manager, `firebase deploy` tries
        # to prompt for a value interactively — --non-interactive does NOT
        # suppress that specific prompt (firebase-tools limitation), so the
        # job just hangs on stdin until the runner kills it (exit code 130),
        # instead of failing clearly. Check up front and fail fast with exact
        # remediation commands.
        run: |
          set -e
          MISSING=""
          for SECRET in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET SENDGRID_API_KEY SENDGRID_FROM_EMAIL TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_FROM_NUMBER; do
            if ! gcloud secrets describe "$SECRET" --project innovacaretrainninng-staging >/dev/null 2>&1; then
              MISSING="$MISSING $SECRET"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing Secret Manager secret(s) in project innovacaretrainninng-staging:$MISSING"
            echo "Create each one (run locally, requires firebase login + project access), then re-run this workflow:"
            for SECRET in $MISSING; do
              echo "  firebase functions:secrets:set $SECRET --project innovacaretrainninng-staging"
            done
            exit 1
          fi

      - name: Deploy to Firebase (staging)
        # functions:default (not bare "functions") because the innovacare-training
        # codebase's source was never checked into this repo (its index.ts is
        # empty) while real production functions (blog creation, agent tasks,
        # etc.) run under that codebase name. Bare "functions" diffs every
        # codebase and, in non-interactive mode, would either abort or — with
        # --force — delete those functions outright. Scoping to :default skips
        # that codebase entirely so they're never evaluated or touched.
        run: |
          ONLY="hosting,firestore,storage,database"
          if [ "${{ inputs.deploy_functions }}" = "true" ]; then
            ONLY="$ONLY,functions:default"
          fi
          npx firebase-tools@13 deploy \
            --project innovacaretrainninng-staging \
            --only "$ONLY" \
            --non-interactive

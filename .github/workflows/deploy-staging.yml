name: Promote to staging

# Manual promotion only. Staging is its own separate Firebase project
# (innovacaretrainninng-staging) with its own Firestore/Storage/Database/
# Functions — not shared with dev — so this deploys the full stack there,
# same shape as deploy-dev.yml / deploy-production.yml.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA to deploy to staging'
        required: false
        default: main

concurrency:
  group: deploy-staging
  cancel-in-progress: false

defaults:
  run:
    working-directory: innovacare-trainning-main

jobs:
  deploy:
    name: Build & deploy (staging)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: innovacare-trainning-main/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Build (optimized, pointed at the staging Firebase backend)
        run: npx ng build --configuration staging

      - name: Install functions dependencies (default codebase)
        working-directory: innovacare-trainning-main/functions
        run: npm ci

      - name: Install functions dependencies (innovacare-training codebase)
        working-directory: innovacare-trainning-main/innovacare-training
        run: npm ci

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}

      - name: Deploy to Firebase (staging)
        # NOTE: "database" (Realtime Database) is deliberately left out here —
        # unlike dev/prod, this is a brand-new project and RTDB isn't
        # provisioned by default. Add ",database" to --only once it's enabled
        # (Firebase console → Realtime Database → Create Database) and
        # database.rules.json has been reviewed for this project.
        run: |
          npx firebase-tools@13 deploy \
            --project innovacaretrainninng-staging \
            --only hosting,firestore,storage,functions \
            --non-interactive

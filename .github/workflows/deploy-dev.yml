name: Deploy to dev

# Every push to main deploys straight to the dev Firebase project
# (innovacaretrainning-dev) — hosting, Firestore/Storage/Database rules, and
# Cloud Functions. Promoting to staging or production is a separate, manual
# workflow (see deploy-staging.yml / deploy-production.yml).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-dev
  cancel-in-progress: false

defaults:
  run:
    working-directory: innovacare-trainning-main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build & deploy (dev)
    runs-on: ubuntu-latest
    environment: innovacaretrainning-dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: innovacare-trainning-main/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Build (optimized, pointed at the dev Firebase backend)
        run: npx ng build --configuration dev

      - name: Install functions dependencies (default codebase)
        working-directory: innovacare-trainning-main/functions
        run: npm ci

      - name: Install functions dependencies (innovacare-training codebase)
        working-directory: innovacare-trainning-main/innovacare-training
        run: npm ci

      - uses: google-github-actions/auth@v2
        with:
          project_id: innovacaretrainning-dev
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: firebase-adminsdk-fbsvc@innovacaretrainning-dev.iam.gserviceaccount.com

      - name: Deploy to Firebase (dev)
        # functions:default (not bare "functions") because the live project has
        # functions under the innovacare-training codebase whose source was
        # never checked into this repo (its index.ts is empty). Deploying bare
        # "functions" diffs every codebase and non-interactively refuses to
        # proceed rather than silently deleting them — scoping to :default
        # skips that codebase entirely so those functions are left alone.
        #
        # --debug is TEMPORARY, to diagnose why createOrganizationAdminHttp
        # keeps failing to get its public invoker IAM policy set while other
        # functions succeed. Remove it once diagnosed. Piped through sed to
        # redact any Bearer/Authorization value in place (not drop the whole
        # line — the real error detail sometimes shares a line with it):
        # --debug can print full request objects on fetch errors, including
        # the live OAuth token (full cloud-platform scope), and this repo is
        # public, so that must never reach the raw log. `set -o pipefail` so
        # a failing deploy still fails the step even through the pipe.
        run: |
          set -o pipefail
          npx firebase-tools@13 deploy \
            --project innovacaretrainning-dev \
            --only hosting,firestore,storage,database,functions:default \
            --non-interactive \
            --debug 2>&1 | sed -E \
              -e 's/Bearer [A-Za-z0-9_.-]+/Bearer [REDACTED]/gi' \
              -e 's/"Authorization":"[^"]*"/"Authorization":"[REDACTED]"/gi' \
              -e "s/'Authorization': '[^']*'/'Authorization': '[REDACTED]'/gi"

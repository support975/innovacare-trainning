<div class="stage" appPublicTranslate>
  <div class="card">
    <ng-container *ngIf="loading()">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Préparation de votre espace de démonstration…</h1>
      <p class="muted">Création d'une entreprise fictive avec des employés et des cours d'exemple pour que vous puissiez explorer librement.</p>
    </ng-container>

    <ng-container *ngIf="!loading()">
      <h1>Impossible de démarrer la démonstration</h1>
      <p class="error">{{ error() }}</p>
      <div class="actions">
        <button class="btn" type="button" (click)="launch()">Réessayer</button>
        <a class="btn outline" routerLink="/home">Retour à l'accueil</a>
      </div>
    </ng-container>
  </div>
</div>

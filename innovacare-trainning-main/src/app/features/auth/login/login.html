<div class="auth-container" appPublicTranslate>
    <div class="auth-wrapper">
      <div class="card auth-card">
        <div class="card-header">
          <div class="logo-section" style="text-align: center;">
            <h1 class="title">Bon retour</h1>
            <p class="subtitle">PLATEFORME INNOVACARE TRAINING</p>
          </div>
        </div>

        <div class="card-body">
          <form [formGroup]="form" (ngSubmit)="submit()" class="form">
            <!-- Email Field -->
            <div class="form-group">
              <label class="label">Adresse courriel</label>
              <div class="input-wrapper">
                <span class="input-icon">✉️</span>
                <input
                  class="input"
                  type="email"
                  formControlName="email"
                  placeholder="vous@clinique.com"
                  autocomplete="email"
                />
              </div>
              <small class="help error-text" *ngIf="form.controls.email.invalid && form.controls.email.touched">
                ⚠️ Adresse courriel valide requise
              </small>
            </div>

            <!-- Password Field -->
            <div class="form-group">
              <label class="label">Mot de passe</label>
              <div class="input-wrapper">
                <span class="input-icon">🔒</span>
                <input
                  class="input"
                  type="password"
                  formControlName="password"
                  placeholder="••••••••"
                  autocomplete="current-password"
                />
              </div>
              <small class="help error-text" *ngIf="form.controls.password.invalid && form.controls.password.touched">
                ⚠️ 6 caractères minimum requis
              </small>
            </div>

            <!-- Error Message -->
            <div class="error-alert" *ngIf="error()">
              <span class="error-icon">❌</span>
              <p class="error">{{ error() }}</p>
            </div>

            <!-- Sign In Button -->
            <button
              class="btn btn-primary"
              type="submit"
              [disabled]="loading()"
              [class.loading]="loading()">
              <span *ngIf="!loading()">Se connecter</span>
              <span *ngIf="loading()">Connexion en cours...</span>
            </button>

            <!-- Divider -->
            <div class="divider">
              <span>ou</span>
            </div>

            <!-- Google Sign In Button -->
            <button
              class="btn btn-google"
              type="button"
              (click)="google()"
              [disabled]="loading()">
              <span class="google-icon">🔐</span>
              Se connecter avec Google
            </button>
          </form>

          <!-- Forgot Password & Back to Home -->
          <div class="footer-links">
            <p class="forgot-password">
              Besoin d'un accès individuel ? <a routerLink="/signup" class="link">Créer un profil apprenant</a>
            </p>
            <p class="forgot-password">
              Mot de passe oublié ? <a routerLink="/reset" class="link">Réinitialisez-le ici</a>
            </p>
            <button
              routerLink="/"
              class="btn btn-link"
              type="button">
              ← Retour à l'accueil
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

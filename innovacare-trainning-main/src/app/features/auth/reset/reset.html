<div class="auth" appPublicTranslate>
    <div class="card">
      <h1>Réinitialiser le mot de passe</h1>
      <p class="muted">Entrez le courriel de votre compte. Nous vous enverrons un lien de réinitialisation.</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="form">
        <label class="label">Courriel</label>
        <input class="input" type="email" formControlName="email" placeholder="vous@clinique.com" />
        <small class="help" *ngIf="form.controls.email.invalid && form.controls.email.touched">
          Courriel valide requis
        </small>

        <button class="btn" type="submit" [disabled]="loading()">Envoyer le lien de réinitialisation</button>
        <a routerLink="/login" class="btn outline" style="margin-left:8px">Retour à la connexion</a>
      </form>

      <p class="ok" *ngIf="success()">{{ success() }}</p>
      <p class="error" *ngIf="error()">{{ error() }}</p>
    </div>
  </div>
